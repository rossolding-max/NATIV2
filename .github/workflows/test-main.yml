name: Main Branch

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  full-suite:
    name: Full test suite + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - name: Lint + typecheck
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
      - name: Schemas
        run: |
          uv run python scripts/verify_pydantic_codegen.py
      - name: Tests + coverage
        env:
          POSTGRES_PASSWORD: ci-postgres-pw
          DB_MASTER_KEY: ci-master-key-base64-32-chars-long==
          ANTHROPIC_API_KEY: sk-ant-ci-stub
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest tests/unit tests/integration --cov=app --cov-report=xml --cov-report=term -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
