# Markdown lint config — runs as pre-commit hook on docs/*.md.
# Permissive defaults to avoid fighting legitimate doc patterns
# (tables, code blocks with mixed indentation, long lines, etc.).

default: true

# Disable line-length entirely. Spec docs include lines well >600 chars
# (taxonomy + KPI enum prose). Hard wrapping in prose is anti-pattern.
MD013: false

# Blank lines around lists not required — the spec uses inline lists frequently.
MD032: false

# Blank lines around headings not required.
MD022: false

# List indentation can vary (numbered + bulleted mixed in places).
MD007: false

# Allow ordered/unordered list mixing (the spec uses both freely).
MD030: false

# Blank lines around fenced code blocks not required (inline code blocks in prose).
MD031: false

# Ordered-list prefix sequencing not enforced (docs occasionally restart numbering mid-section).
MD029: false

# Blank lines around tables not required (data_lineage.md inlines many tables).
MD058: false

# Inline HTML allowed (we use <br> + tables + the occasional <details>)
MD033: false

# First line need not be h1 (some docs start with status indicator)
MD041: false

# Multiple H1s allowed (contract templates use top-level headings per clause).
MD025: false

# Allow duplicate headings (we use ## Examples, ## Acceptance multiple times)
MD024:
  siblings_only: true

# Allow bare URLs (we link to schema $ids + workflow docs frequently)
MD034: false

# Allow trailing punctuation in headings
MD026:
  punctuation: ".,;:!"

# Allow emphasis as heading (we use **bold** as section breaks in places)
MD036: false

# Multiple blank lines OK in places (separating large table sections)
MD012:
  maximum: 2

# Code-fence language tag not required (sometimes we use ``` for raw output)
MD040: false
